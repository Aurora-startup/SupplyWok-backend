#Spring Application Name
spring.application.name=supply-wok-platform
spring.profiles.default=dev

# Spring Data JPA Configuration
spring.jpa.database: postgresql

# Spring Data JPA Hibernate Configuration
spring.jpa.properties.hibernate.format_sql: true
spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.naming.physical-strategy=aurora.supply_wok.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=none
